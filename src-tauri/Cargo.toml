[package]
name = "guitarlab"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
description = "GuitarLab Windows 로컬 앱"
license = "MIT"

[lib]
name = "guitarlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
cpal = "=0.18.2"
ringbuf = "=0.5.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
sha2 = "=0.11.1"
tauri-plugin-dialog = { version = "=2.8.2", default-features = false }
rustfft = "=6.4.1"
# docs/12 "모니터 AmpliTube 삽입 v1": 사용자가 설치한 VST3를 앱 안에서 호스팅합니다(CPAL 백엔드·프로세스 격리 기본 기능 끔).
vst3-host = { version = "=0.11.0", default-features = false }

[target.'cfg(windows)'.dependencies]
# DSP 스레드 우선순위(SetThreadPriority)만 씁니다.
windows-sys = { version = "=0.61.2", features = ["Win32_System_Threading", "Win32_System_Ole", "Win32_UI_WindowsAndMessaging"] }



