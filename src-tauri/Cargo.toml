[package]
name = "guitarlab"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
description = "GuitarLab Windows 로컬 앱"
license = "MIT"

[lib]
name = "guitarlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
cpal = "=0.18.2"
ringbuf = "=0.5.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
sha2 = "=0.11.1"
tauri-plugin-dialog = { version = "=2.8.2", default-features = false }
rustfft = "=6.4.1"



